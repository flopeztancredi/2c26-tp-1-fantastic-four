log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" upstream=$upstream_addr';

upstream api {
    server exchange-api-1:3000;
}

server {
    listen 80;
    access_log /dev/stdout upstream_log;

    location / {
        proxy_pass http://api/;
    }
}
