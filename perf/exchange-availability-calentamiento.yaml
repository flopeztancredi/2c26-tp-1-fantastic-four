# calentamiento comun de la suite (perf/correr-suite-linux.sh): se corre solo, antes de cada
# corrida real, y no se analiza (por eso no aparece en la tabla de "Replicar las corridas" del
# README). mismos dos flows que el resto de availability, para que la api compile en caliente
# (JIT) y graphite cree las series antes de la corrida que si se mide. ver GUIA_suite.md.
config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-exchange-calentamiento"
    docker:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-exchange-calentamiento-docker"

  http:
    timeout: 10

  phases:
    - name: "Calentamiento 40 req/s"
      duration: 30
      arrivalRate: 40

scenarios:
  - name: "Exchange ARS -> USD"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
  - name: "Exchange USD -> ARS"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: 1
            baseAccountId: 102
            counterAccountId: 101
