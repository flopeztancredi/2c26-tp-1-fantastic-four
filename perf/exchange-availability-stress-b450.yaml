# Corrida 2, variante B = 450 (hipotesis, no medida por breakpoint). Ver README.md.
config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-exchange-stress-b450"
    docker:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-exchange-stress-b450-docker"

  http:
    timeout: 10

  phases:
    - name: "Linea base 320"
      duration: 60
      arrivalRate: 320
    - name: "Rampa 320 -> 1.5B"
      duration: 30
      arrivalRate: 320
      rampTo: 675
    - name: "Sobrecarga 1.5B (675)"
      duration: 60
      arrivalRate: 675
    - name: "Recuperacion 0.5B (225, tope RTO 180 s)"
      duration: 180
      arrivalRate: 225
    - name: "Verificacion 1.0B (450)"
      duration: 60
      arrivalRate: 450

scenarios:
  - name: "Exchange ARS -> USD"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
  - name: "Exchange USD -> ARS"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: 1
            baseAccountId: 102
            counterAccountId: 101
