# cliente representativo: mira las tasas, piensa (como una persona mirando la app) y despues
# cambia moneda y mira sus cuentas. ver GUIA_suite.md. llegada constante (no un escalon ni un
# pico), para tener una foto del comportamiento normal, comparable entre ramas.
#
# mezcla de pares (siempre con ARS de un lado: solo hay tasa ARS <-> cada moneda, nunca
# EUR <-> USD ni EUR <-> BRL):
#   - ARS <-> USD: 70 % (35 % + 35 %), el par mas usado del servicio
#   - ARS <-> EUR: 20 % (10 % + 10 %)
#   - ARS <-> BRL: 10 % (5 % + 5 %)
# dentro de cada moneda, mitad compra y mitad vende (peso igual entre las dos direcciones).
#
# montos: no un valor fijo, sino un rango chico por moneda (500-1500 ARS o 1-5 unidades de
# la moneda extranjera), la misma escala que ya usan breakpoint/stress/endurance. con esta
# escala y 80 escenarios/s durante 10 min, el volumen total queda muy por debajo de los saldos
# iniciales (ver GUIA_endurance-performance.md: a esa escala alcanzan para ~470.000 exchanges).
config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-exchange-representativa"
    docker:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-exchange-representativa-docker"

  http:
    timeout: 10

  phases:
    - name: "Llegada constante 80 escenarios/s"
      duration: 600
      arrivalRate: 80

scenarios:
  - name: "Cliente: ARS -> USD"
    weight: 35
    flow:
      - get:
          url: '/rates'
      - think: "{{ $randomNumber(1, 3) }}"
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: "{{ $randomNumber(500, 1500) }}"
            baseAccountId: 101
            counterAccountId: 102
      - get:
          url: '/accounts'
  - name: "Cliente: USD -> ARS"
    weight: 35
    flow:
      - get:
          url: '/rates'
      - think: "{{ $randomNumber(1, 3) }}"
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: "{{ $randomNumber(1, 3) }}"
            baseAccountId: 102
            counterAccountId: 101
      - get:
          url: '/accounts'
  - name: "Cliente: ARS -> EUR"
    weight: 10
    flow:
      - get:
          url: '/rates'
      - think: "{{ $randomNumber(1, 3) }}"
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "EUR"
            baseAmount: "{{ $randomNumber(500, 1500) }}"
            baseAccountId: 101
            counterAccountId: 103
      - get:
          url: '/accounts'
  - name: "Cliente: EUR -> ARS"
    weight: 10
    flow:
      - get:
          url: '/rates'
      - think: "{{ $randomNumber(1, 3) }}"
      - post:
          url: '/exchange'
          json:
            baseCurrency: "EUR"
            counterCurrency: "ARS"
            baseAmount: "{{ $randomNumber(1, 3) }}"
            baseAccountId: 103
            counterAccountId: 101
      - get:
          url: '/accounts'
  - name: "Cliente: ARS -> BRL"
    weight: 5
    flow:
      - get:
          url: '/rates'
      - think: "{{ $randomNumber(1, 3) }}"
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "BRL"
            baseAmount: "{{ $randomNumber(500, 1500) }}"
            baseAccountId: 101
            counterAccountId: 104
      - get:
          url: '/accounts'
  - name: "Cliente: BRL -> ARS"
    weight: 5
    flow:
      - get:
          url: '/rates'
      - think: "{{ $randomNumber(1, 3) }}"
      - post:
          url: '/exchange'
          json:
            baseCurrency: "BRL"
            counterCurrency: "ARS"
            baseAmount: "{{ $randomNumber(1, 5) }}"
            baseAccountId: 104
            counterAccountId: 101
      - get:
          url: '/accounts'
