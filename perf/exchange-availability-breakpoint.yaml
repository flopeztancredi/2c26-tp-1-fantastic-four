# Corrida 1 — BREAKPOINT (Niveles 0, 2 y 3)
# QA: availability (y performance: capacity / load sensitivity)
#
# Objetivo: subir la carga en escalones fijos hasta que el sistema deje de
# atender bien, para encontrar el boundary de disponibilidad.
#
# Ejecutar desde perf/ (PowerShell):   .\correr-breakpoint-docker.ps1
#   (artillery en un container dentro de la red de compose; ver README.md)
# Dashboard: variable $server = artillery-exchange-breakpoint-docker
#
# Cada usuario virtual hace UN solo request, así que arrivalRate ≈ req/s.
# Cada escalón dura 60 s para tener suficientes requests por escalón.
#
# Escalones finos (de a 80 req/s) desde 160: las corridas del 25/09 y 26/09
# mostraron 100 % de éxito hasta 320 y un límite de la api entre 320 y 640.
# Los escalones anteriores (5, 10, 20, 40, 80, 160, 320, 640) quedaron en
# git y en perf/resultados/2026-09-25_breakpoint_artillery-en-windows/.

config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-exchange-breakpoint"
    # mismo test pero con artillery corriendo en un container dentro de la red de compose
    docker:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-exchange-breakpoint-docker"

  http:
    # Explícito para el informe: si una respuesta tarda más de 10 s,
    # artillery la corta y la cuenta como error ETIMEDOUT (omission).
    timeout: 10

  phases:
    - name: "Calentamiento 80 req/s"
      duration: 30
      arrivalRate: 80
    - name: "Escalon 160 req/s"
      duration: 60
      arrivalRate: 160
    - name: "Escalon 240 req/s"
      duration: 60
      arrivalRate: 240
    - name: "Escalon 320 req/s"
      duration: 60
      arrivalRate: 320
    - name: "Escalon 400 req/s"
      duration: 60
      arrivalRate: 400
    - name: "Escalon 480 req/s"
      duration: 60
      arrivalRate: 480
    - name: "Escalon 560 req/s"
      duration: 60
      arrivalRate: 560
    - name: "Escalon 640 req/s"
      duration: 60
      arrivalRate: 640

# Escenario: la operación central del negocio (POST /exchange), en las dos
# direcciones ARS<->USD y con montos chicos. Así los saldos internos no se
# agotan durante la prueba: con saldo insuficiente la api responde HTTP 500
# ("Not enough funds"), que es una regla de negocio y ensuciaría la medición
# de disponibilidad.
scenarios:
  - name: "Exchange ARS -> USD"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
  - name: "Exchange USD -> ARS"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: 1
            baseAccountId: 102
            counterAccountId: 101
