# Corrida 2: stress + recuperacion con B = 320 (B del breakpoint en Windows). Ver README.md.
config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-exchange-stress"
    docker:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-exchange-stress-docker"

  http:
    timeout: 10

  phases:
    - name: "Linea base 0.5B"
      duration: 60
      arrivalRate: 160
    - name: "Sobrecarga 1.5B"
      duration: 60
      arrivalRate: 480
    - name: "Recuperacion 0.5B (tope RTO 180 s)"
      duration: 180
      arrivalRate: 160
    - name: "Verificacion 1.0B"
      duration: 60
      arrivalRate: 320

scenarios:
  - name: "Exchange ARS -> USD"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
  - name: "Exchange USD -> ARS"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: 1
            baseAccountId: 102
            counterAccountId: 101
