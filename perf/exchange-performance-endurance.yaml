# Performance: endurance a carga constante (160 req/s, 10 min). Ver GUIA_endurance-performance.md.
# Mismo escenario que el breakpoint y los stress, para que los resultados sean comparables.
config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-exchange-endurance"
    docker:
      target: 'http://nginx'
      plugins:
        statsd:
          host: graphite
          port: 8125
          prefix: "artillery-exchange-endurance-docker"

  http:
    timeout: 10

  phases:
    - name: "Carga constante 160 req/s"
      duration: 600
      arrivalRate: 160

scenarios:
  - name: "Exchange ARS -> USD"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
  - name: "Exchange USD -> ARS"
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: 1
            baseAccountId: 102
            counterAccountId: 101
