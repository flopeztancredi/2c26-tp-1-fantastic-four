services:
    api:
      build: ./app
      cpus: 1.0
      mem_limit: 512m
      environment:
        STATE_ADAPTER: ${STATE_ADAPTER:-redis}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      depends_on:
        - redis

    nginx:
        image: nginx:1.29.8
        cpus: 0.5
        mem_limit: 128m
        ports:
            - "5555:80"
        volumes:
            - ${NGINX_CONFIG:-./nginx_reverse_proxy.conf}:/etc/nginx/conf.d/default.conf:ro
            - ./store/static/files:/static:ro
        depends_on:
            - api

    graphite:
        image: graphiteapp/graphite-statsd:1.1.10-5
        volumes:
            - ./statsd.config.json:/opt/statsd/config/udp.js
            - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        ports:
            - "8090:80"
            - "8125:8125/udp"
            - "8126:8126"

    grafana:
        image: grafana/grafana:11.5.10
        ports:
            - "80:3000"
        volumes:
            - "grafana_config:/var/lib/grafana"

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.51.0
        links:
            - graphite
        command: -storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true
        ports:
            - "8080:8080"
        volumes:
            - "/:/rootfs:ro"
            - "/var/run:/var/run:rw"
            - "/sys:/sys:ro"
            - "/var/lib/docker/:/var/lib/docker:ro"

    redis:
        image: redis:7.4.11
        command: redis-server --appendonly yes --appendfsync everysec
        cpus: 0.5
        mem_limit: 256m
        volumes:
            - redis_data:/data

volumes:
    grafana_config:
        driver: local
    redis_data:
        driver: local
