services:
    api:
      build: ./app
      cpus: 1.0
      mem_limit: 512m
      # si el proceso termina por un error, Docker lo vuelve a levantar; no lo hace si se lo detiene a mano
      restart: unless-stopped
      stop_grace_period: 10s
      # ping/echo: Docker consulta GET /health; el estado (starting, healthy, unhealthy) queda en docker ps y docker events
      healthcheck:
        test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
        interval: 5s
        timeout: 2s
        retries: 3
        start_period: 10s
        start_interval: 1s

    nginx:
        image: nginx:1.29.8
        cpus: 0.5
        mem_limit: 128m
        ports:
            - "5555:80"
        volumes:
            - ./nginx_reverse_proxy.conf:/etc/nginx/conf.d/default.conf:ro
            - ./store/static/files:/static:ro
        links:
            - api
        depends_on:
            api:
                condition: service_healthy

    graphite:
        image: graphiteapp/graphite-statsd:1.1.10-5
        volumes:
            - ./statsd.config.json:/opt/statsd/config/udp.js
            - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        ports:
            - "8090:80"
            - "8125:8125/udp"
            - "8126:8126"

    grafana:
        image: grafana/grafana:11.5.10
        ports:
            - "80:3000"
        volumes:
            - "grafana_config:/var/lib/grafana"

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.51.0
        links:
            - graphite
        command: -storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true
        ports:
            - "8080:8080"
        volumes:
            - "/:/rootfs:ro"
            - "/var/run:/var/run:rw"
            - "/sys:/sys:ro"
            - "/var/lib/docker/:/var/lib/docker:ro"

volumes:
    grafana_config:
        driver: local
