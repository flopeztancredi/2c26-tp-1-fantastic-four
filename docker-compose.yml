services:
    api:
      build: ./app
      cpus: 1.0
      # core fijo para medir siempre sobre el mismo tipo de core. En el i7-1360P de la maquina
      # de medicion, 0 a 7 son los cores rapidos (P) y 8 a 15 los lentos (E). Artillery y el
      # stack de metricas van en los E, para no competir con la api ni con nginx
      cpuset: "${API_CPUSET:-2}"
      mem_limit: 512m
      environment:
        STATE_ADAPTER: ${STATE_ADAPTER:-redis}
        REDIS_URL: ${REDIS_URL:-redis://redis:6379}
        IDEMPOTENCY_TTL_MS: ${IDEMPOTENCY_TTL_MS:-600000}
        METRICS_ADAPTER: ${METRICS_ADAPTER:-statsd}
        STATSD_HOST: graphite
        STATSD_PORT: "8125"
        METRICS_PREFIX: arvault.exchange
      depends_on:
        redis:
          condition: service_healthy
        graphite:
          condition: service_started
      restart: unless-stopped
      stop_grace_period: 10s
      healthcheck:
        test: ["CMD", "curl", "-fsS", "-m", "2", "-o", "/dev/null", "http://localhost:3000/health"]
        interval: 5s
        timeout: 3s
        retries: 3
        start_period: 10s

    nginx:
        image: nginx:1.29.8
        cpus: 0.5
        cpuset: "${NGINX_CPUSET:-4}"
        mem_limit: 128m
        ports:
            - "5555:80"
        volumes:
            - ${NGINX_CONFIG:-./nginx_reverse_proxy.conf}:/etc/nginx/conf.d/default.conf:ro
            - ./store/static/files:/static:ro
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy

    graphite:
        image: graphiteapp/graphite-statsd:1.1.10-5
        cpuset: "${METRICAS_CPUSET:-8-10}"
        volumes:
            - ./statsd.config.json:/opt/statsd/config/udp.js
            - ./graphite.storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        ports:
            - "8090:80"
            # statsd solo desde esta maquina: desde la red nadie puede mandar metricas falsas
            - "127.0.0.1:8125:8125/udp"
            - "127.0.0.1:8126:8126"

    grafana:
        image: grafana/grafana:11.5.10
        cpuset: "${METRICAS_CPUSET:-8-10}"
        ports:
            - "80:3000"
        volumes:
            - "grafana_config:/var/lib/grafana"

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.51.0
        cpuset: "${METRICAS_CPUSET:-8-10}"
        links:
            - graphite
        command: -storage_driver="statsd" -storage_driver_host="graphite:8125" -storage_driver_db="cadvisor" -storage_driver_buffer_duration="1s" --docker_only=true
        ports:
            - "8080:8080"
        volumes:
            - "/:/rootfs:ro"
            - "/var/run:/var/run:rw"
            - "/sys:/sys:ro"
            - "/var/lib/docker/:/var/lib/docker:ro"

    redis:
        image: redis:7.4.11
        # under memory pressure redis only drops the idempotency keys, the only ones with a ttl
        command: redis-server --appendonly yes --appendfsync everysec --maxmemory 160mb --maxmemory-policy volatile-ttl
        cpus: 0.5
        # core propio: las metricas pasan a 8 a 10 para dejarle el 11
        cpuset: "${REDIS_CPUSET:-11}"
        mem_limit: 256m
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 3
            start_period: 5s
        volumes:
            - redis_data:/data

volumes:
    grafana_config:
        driver: local
    redis_data:
        driver: local
