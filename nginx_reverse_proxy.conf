upstream api { 
    server exchange-api-1:3000;
}

# 0.9 of the measured B (800 req/s)
limit_req_zone global zone=exchange_global:1m rate=720r/s;

server {
    listen 80;

    location = /exchange {
        limit_req zone=exchange_global burst=72 nodelay;
        limit_req_status 429;

        proxy_pass http://api/exchange;
    }

    location / {
        proxy_pass http://api/;
    }
}