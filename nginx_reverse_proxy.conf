log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" upstream=$upstream_addr';

upstream api {
    # re-resolves api every 5s with docker dns to find the --scale replicas, resolve needs the zone
    zone api 64k;
    resolver 127.0.0.11 valid=5s;
    server api:3000 resolve;
}

# 0.9 of the measured B (800 req/s)
limit_req_zone global zone=exchange_global:1m rate=720r/s;

server {
    listen 80;
    access_log /dev/stdout upstream_log;

    location = /exchange {
        limit_req zone=exchange_global burst=72 nodelay;
        limit_req_status 429;

        proxy_pass http://api/exchange;
    }

    location / {
        proxy_pass http://api/;

        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;

        proxy_next_upstream error;
        proxy_next_upstream_tries 2;
    }
}
