log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" upstream=$upstream_addr';

upstream api {
    # re-resolves api every 5s with docker dns to find the --scale replicas, resolve needs the zone
    zone api 64k;
    resolver 127.0.0.11 valid=5s;
    server api:3000 resolve;
}

server {
    listen 80;
    access_log /dev/stdout upstream_log;

    location / {
        proxy_pass http://api/;
    }
}
