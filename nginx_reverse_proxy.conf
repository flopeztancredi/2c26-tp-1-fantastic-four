# GET /rates is cached for 1s, so most rate reads never reach the api
proxy_cache_path /var/cache/nginx/rates_cache levels=1:2 keys_zone=rates_cache:10m max_size=10m inactive=60s use_temp_path=off;

upstream api { 
    server exchange-api-1:3000;
}

server {
    listen 80;

    location = /rates {
        proxy_pass http://api;

        proxy_cache rates_cache;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://api/;
    }
}