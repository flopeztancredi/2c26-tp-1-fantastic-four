log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" upstream=$upstream_addr';

upstream api {
    # re-resolves api every 5s with docker dns to find the --scale replicas, resolve needs the zone
    zone api 64k;
    resolver 127.0.0.11 valid=5s;
    server api:3000 resolve;
}

# GET /rates is cached for 1s, so most rate reads never reach the api
proxy_cache_path /var/cache/nginx/rates_cache levels=1:2 keys_zone=rates_cache:10m max_size=10m inactive=60s use_temp_path=off;

# 0.9 of the measured B of the integrated system (1040 req/s)
limit_req_zone global zone=exchange_global:1m rate=936r/s;

# Retry-After only on the 429 of the rate limit
map $status $retry_after {
    429     1;
    default "";
}

server {
    listen 80;
    access_log /dev/stdout upstream_log;

    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;

    proxy_next_upstream error;
    proxy_next_upstream_tries 2;

    location = /rates {
        proxy_pass http://api;

        proxy_cache rates_cache;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /exchange {
        limit_req zone=exchange_global burst=94 nodelay;
        limit_req_status 429;
        add_header Retry-After $retry_after always;

        proxy_pass http://api/exchange;
    }

    location / {
        proxy_pass http://api/;
    }
}
