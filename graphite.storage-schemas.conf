# Schema definitions for Whisper files. Entries are scanned in order,
# and first match wins. This file is scanned for changes every 60 seconds.
#
#  [name]
#  pattern = regex
#  retentions = timePerPoint:timeToStore, timePerPoint:timeToStore, ...

# Carbon's internal metrics. This entry should match what is specified in
# CARBON_METRIC_PREFIX and CARBON_METRIC_INTERVAL settings

[carbon]
pattern = ^carbon\.
retentions = 10s:6h

# Saldo de la prueba de carrera (perf/reponer-saldo-carrera.py): 1 s, para ver cómo cae el saldo dentro de cada ciclo
[carrera_saldo]
pattern = ^stats\.gauges\.artillery-exchange-carrera-saldo\.saldo\.
retentions = 1s:6h

# Ping/echo y estado del container en la prueba de caída (perf/monitor-salud.py): 1 s, para ver caídas de 1 o 2 s
[caida_salud]
pattern = ^stats\.gauges\.artillery-exchange-caida\.salud\.
retentions = 1s:6h

[stats]
pattern = ^stats.*
retentions = 10s:6h
